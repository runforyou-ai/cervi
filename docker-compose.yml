services:
  # 本地开发使用的 PostgreSQL。
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cervi
      POSTGRES_USER: cervi
      POSTGRES_PASSWORD: cervi_local_dev
    ports:
      - "5432:5432"
    volumes:
      - cervi-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cervi -d cervi"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  # 保存本地数据库数据。
  cervi-postgres-data:
