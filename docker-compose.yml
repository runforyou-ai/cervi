services:
  # 本地开发使用的 PostgreSQL。
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cervi
      POSTGRES_USER: cervi
      POSTGRES_PASSWORD: cervi_local_dev
    ports:
      - "5432:5432"
    volumes:
      - cervi-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cervi -d cervi"]
      interval: 2s
      timeout: 5s
      retries: 15

  # 本地开发使用的 S3 兼容对象存储。
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: cervi
      RUSTFS_SECRET_KEY: cervi_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cervi-rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 40s

volumes:
  cervi-postgres-data:
  cervi-rustfs-data:
