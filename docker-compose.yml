services:
  # 本地开发使用的 PostgreSQL。
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cervi
      POSTGRES_USER: cervi
      POSTGRES_PASSWORD: cervi_local_dev
    ports:
      - "5432:5432"
    volumes:
      - cervi-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cervi -d cervi"]
      interval: 2s
      timeout: 5s
      retries: 15

  # 本地开发共享的 NATS JetStream。
  nats:
    image: nats:2.14.5-alpine
    command:
      - --name=cervi-local
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - cervi-nats-data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  cervi-postgres-data:
  cervi-nats-data:
