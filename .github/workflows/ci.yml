name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Keep the required check available if a merge queue is enabled later.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve Go toolchain paths
        id: toolchain
        shell: bash
        run: |
          {
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "gocache=$(go env GOCACHE)"
            echo "gobin=$(go env GOPATH)/bin"
            echo "wails=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          } >> "$GITHUB_OUTPUT"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 缓存只在默认分支保存：其他 ref 写入的缓存无法被跨分支复用，却同样占用仓库配额。
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.toolchain.outputs.gomodcache }}
            ${{ steps.toolchain.outputs.gocache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Restore wails3 CLI
        id: wails-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.gobin }}/wails3
          key: wails3-${{ runner.os }}-${{ steps.toolchain.outputs.wails }}

      - name: Install wails3 CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.toolchain.outputs.wails }}

      - name: Save wails3 CLI
        if: steps.wails-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.gobin }}/wails3
          key: wails3-${{ runner.os }}-${{ steps.toolchain.outputs.wails }}

      - name: Check Wails version alignment
        shell: bash
        env:
          WAILS_VERSION: ${{ steps.toolchain.outputs.wails }}
        run: |
          go_version="${WAILS_VERSION#v}"
          runtime_version="$(node -p "require('./frontend/package.json').dependencies['@wailsio/runtime']")"
          if [[ "$runtime_version" != "$go_version" ]]; then
            echo "Wails version mismatch: Go=$go_version, frontend=$runtime_version"
            exit 1
          fi

      - name: Check generated application service adapters
        shell: bash
        run: |
          go generate ./internal/appservice
          generated_changes="$(git status --short --untracked-files=all -- \
            internal/appservice/service_gen.go \
            internal/api/service_gen.go \
            internal/apiproxy/backend_gen.go)"
          if [[ -n "$generated_changes" ]]; then
            echo "Application service adapters are out of date:"
            printf '%s\n' "$generated_changes"
            git diff -- \
              internal/appservice/service_gen.go \
              internal/api/service_gen.go \
              internal/apiproxy/backend_gen.go
            exit 1
          fi

      - name: Check generated Wails bindings
        shell: bash
        run: |
          wails3 generate bindings -clean=true -ts -i
          git diff --exit-code -- go.mod go.sum frontend/bindings

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend message windows
        run: wails3 task test:frontend

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check Go formatting
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "These Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Vet Go server build
        env:
          CGO_ENABLED: "0"
        run: go vet -tags=server ./...

      - name: Start integration test dependencies
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres nats

      - name: Test Go server build
        run: wails3 task test:server

      - name: Build production server
        env:
          CGO_ENABLED: "0"
        run: >
          go build
          -tags=server,production
          -trimpath
          -buildvcs=false
          -ldflags="-w -s"
          -o bin/cervi-server
          .

      - name: Test Go Linux desktop build
        run: wails3 task test:desktop

      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.toolchain.outputs.gomodcache }}
            ${{ steps.toolchain.outputs.gocache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: build/docker/Dockerfile.server
          push: false
          tags: cervi:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=min,ignore-error=true' || '' }}
