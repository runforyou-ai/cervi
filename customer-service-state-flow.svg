<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3300" viewBox="0 0 1800 3300" role="img" aria-labelledby="title desc">
<title id="title">客服会话状态流转图 · 审核建议稿</title>
<desc id="desc">上半部分展示长期会话内服务周期的开放、关闭与负责人流转，下半部分展示 AI 执行的正常回复、转人工和取消。具体字段设计为方案目标，尚未实现。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#516277"/></marker>
  <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1a846c"/></marker>
  <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b57417"/></marker>
</defs>
<style>
  text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#24364a; }
  .title { font-size:42px; font-weight:700; }
  .subtitle { font-size:22px; fill:#63748a; }
  .panel-title { font-size:29px; font-weight:700; }
  .node-title { font-size:27px; font-weight:650; }
  .node-detail { font-size:22px; fill:#465971; }
  .small { font-size:21px; fill:#53657c; }
  .legend { font-size:22px; }
  .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size:21px; }
  .edge { fill:none; stroke:#516277; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; marker-end:url(#arrow); }
  .green-edge { fill:none; stroke:#1a846c; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; marker-end:url(#green-arrow); }
  .amber-edge { fill:none; stroke:#b57417; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; marker-end:url(#amber-arrow); }
</style>
<rect width="1800" height="3300" fill="#f4f7fb"/>

<text x="80" y="79" class="title" text-anchor="start">客服会话状态流转图</text>
<text x="80" y="119" class="subtitle" text-anchor="start">审核建议稿  ·  Conversation → ServiceSession → AI Run  ·  具体契约与字段尚未实现</text>
<rect x="60" y="160" width="1680" height="1450" rx="18" fill="#fff" stroke="#dbe3ed" stroke-width="2"/>
<text x="100" y="216" class="panel-title" text-anchor="start">01   会话周期与负责人</text>
<text x="100" y="251" class="subtitle" text-anchor="start">ServiceSession.status 仅有 open / closed；Q、A、H 是开放周期根据负责人派生的视图。</text>
<rect x="105" y="296" width="485" height="145" rx="14" fill="#f7f9fc" stroke="#e0e7ef" stroke-width="2"/>
<text x="130" y="333" class="legend" text-anchor="start">Conversation 是长期客户会话。</text>
<text x="130" y="369" class="legend" text-anchor="start">每次新服务周期建立独立 ServiceSession。</text>
<text x="130" y="405" class="legend" text-anchor="start">Q / A / H 不新增数据库状态值。</text>
<rect x="705" y="295" width="390" height="125" rx="18" fill="#eef0ff" stroke="#a5b0ee" stroke-width="2"/>
<text x="900.0" y="335" class="node-title" text-anchor="middle">A   AI 负责</text>
<text x="900.0" y="371" class="node-detail" text-anchor="middle">open · assignee = 合格 agent</text>
<rect x="705" y="480" width="390" height="148" rx="18" fill="#f5f8fc" stroke="#b7c8da" stroke-width="2"/>
<text x="900.0" y="520" class="node-title" text-anchor="middle">R   新周期路由</text>
<text x="900.0" y="556" class="node-detail" text-anchor="middle">首条客户消息建立周期</text>
<text x="900.0" y="587" class="node-detail" text-anchor="middle">渠道初始 → 失败 → 公共队列</text>
<rect x="175" y="690" width="430" height="130" rx="18" fill="#fff6e5" stroke="#e6c27d" stroke-width="2"/>
<text x="390.0" y="730" class="node-title" text-anchor="middle">Q   等待分配</text>
<text x="390.0" y="766" class="node-detail" text-anchor="middle">open · assignee = null</text>
<text x="390.0" y="797" class="node-detail" text-anchor="middle">team 可空；为空即公共队列</text>
<rect x="1195" y="690" width="430" height="130" rx="18" fill="#e9f7f1" stroke="#8bcebc" stroke-width="2"/>
<text x="1410.0" y="730" class="node-title" text-anchor="middle">H   真人负责</text>
<text x="1410.0" y="766" class="node-detail" text-anchor="middle">open · assignee = user</text>
<rect x="705" y="955" width="390" height="125" rx="18" fill="#edf1f6" stroke="#afbfce" stroke-width="2"/>
<text x="900.0" y="995" class="node-title" text-anchor="middle">C   本周期已关闭</text>
<text x="900.0" y="1031" class="node-detail" text-anchor="middle">closed</text>
<rect x="705" y="1150" width="390" height="112" rx="18" fill="#f5f8fc" stroke="#b7c8da" stroke-width="2"/>
<text x="900.0" y="1190" class="node-title" text-anchor="middle">R   新周期路由</text>
<text x="900.0" y="1226" class="node-detail" text-anchor="middle">建立新周期 · sequence + 1</text>
<path d="M900 480 L900 420" class="edge"/>
<rect x="923.0" y="428" width="68" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="957" y="458" class="legend" text-anchor="middle">AI</text>
<path d="M705 568 L595 625 L515 690" class="edge"/>
<rect x="570.0" y="588" width="68" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="604" y="618" class="legend" text-anchor="middle">队列</text>
<path d="M1095 568 L1205 625 L1285 690" class="edge"/>
<rect x="1162.0" y="588" width="68" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="1196" y="618" class="legend" text-anchor="middle">真人</text>
<path d="M705 367 L660 367 C625 505 377 540 377 690" class="amber-edge"/>
<rect x="469.0" y="506" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="494" y="536" class="legend" text-anchor="middle">3</text>
<path d="M1095 366 C1270 375 1390 528 1390 690" class="amber-edge"/>
<rect x="1267.0" y="440" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="1292" y="470" class="legend" text-anchor="middle">4</text>
<path d="M1485 690 C1485 485 1310 325 1095 325" class="green-edge"/>
<rect x="1405.0" y="432" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="1430" y="462" class="legend" text-anchor="middle">5</text>
<path d="M530 820 L530 868 L1280 868 L1280 820" class="green-edge"/>
<rect x="878.0" y="845" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="903" y="875" class="legend" text-anchor="middle">2</text>
<path d="M310 820 L310 1017 L705 1017" class="edge"/>
<rect x="478.0" y="994" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="503" y="1024" class="legend" text-anchor="middle">6</text>
<path d="M1505 820 L1505 991 L1095 991" class="edge"/>
<rect x="1275.0" y="968" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="1300" y="998" class="legend" text-anchor="middle">6</text>
<path d="M1095 1042 L1590 1042 L1590 820" class="green-edge"/>
<rect x="1305.0" y="1019" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="1330" y="1049" class="legend" text-anchor="middle">7</text>
<path d="M900 1080 L900 1150" class="edge"/>
<rect x="942.5" y="1092" width="215" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="1050" y="1122" class="legend" text-anchor="middle">8 · 客户新消息</text>
<text x="1130" y="1210" class="small" text-anchor="start">按上方 R 的规则重新选择 Q / A / H</text>
<rect x="100" y="1290" width="1600" height="291" rx="14" fill="#f7f9fc" stroke="#e3e9f1" stroke-width="2"/>
<text x="125" y="1330" class="legend" text-anchor="start">1  首条客户消息创建新周期；初始路由不可用时检查失败路由，再回落公共队列。</text>
<text x="125" y="1366" class="legend" text-anchor="start">2  Q → H：真人领取或首次回复。H → H：显式转交其他真人。</text>
<text x="125" y="1402" class="legend" text-anchor="start">3 / 4  A → Q / H：AI 转人工或管理操作交接在同一事务落地；失败路由仅接受真人或团队，AI 目标 / 无效目标 → 公共队列。</text>
<text x="125" y="1438" class="legend" text-anchor="start">4  人工接管、显式转交真人也进入 H；3 / 4 均取消或终结旧 Run，抑制迟到结果。</text>
<text x="125" y="1474" class="legend" text-anchor="start">5  H → A：显式转交合格 AI；末条消息来自客户则立即调度，否则等待下一条客户消息。</text>
<text x="125" y="1510" class="legend" text-anchor="start">6 / 7  Q、H 可关闭；A 先由真人接管再关闭。显式重开进入 H 并沿用同一周期。</text>
<text x="125" y="1546" class="legend" text-anchor="start">A 回复或追问后保持 A；Q、H 收到客户消息保持当前负责人；AI 不自动抢回，无新增 AI 自动关闭。</text>
<rect x="60" y="1640" width="1680" height="1570" rx="18" fill="#fff" stroke="#dbe3ed" stroke-width="2"/>
<text x="100" y="1697" class="panel-title" text-anchor="start">02   AI Run 执行与终态</text>
<text x="100" y="1734" class="subtitle" text-anchor="start">会话负责人状态与单次执行状态分别记录；回复、追问和转人工是业务 outcome。</text>
<rect x="705" y="1770" width="390" height="103" rx="18" fill="#eef0ff" stroke="#a5b0ee" stroke-width="2"/>
<text x="900.0" y="1810" class="node-title" text-anchor="middle">A + 客户消息</text>
<text x="900.0" y="1846" class="node-detail" text-anchor="middle">合格 AI 被显式调度</text>
<rect x="705" y="1915" width="390" height="98" rx="18" fill="#f5f8fc" stroke="#b7c8da" stroke-width="2"/>
<text x="900.0" y="1955" class="node-title" text-anchor="middle">queued</text>
<text x="900.0" y="1991" class="node-detail" text-anchor="middle">等待任务执行</text>
<rect x="705" y="2055" width="390" height="107" rx="18" fill="#eef0ff" stroke="#a5b0ee" stroke-width="2"/>
<text x="900.0" y="2095" class="node-title" text-anchor="middle">running</text>
<text x="900.0" y="2131" class="node-detail" text-anchor="middle">模型 / 工具循环</text>
<path d="M900 1873 L900 1915" class="edge"/>
<path d="M900 2013 L900 2055" class="edge"/>
<rect x="145" y="2250" width="390" height="130" rx="18" fill="#f5f8fc" stroke="#b7c8da" stroke-width="2"/>
<text x="340.0" y="2290" class="node-title" text-anchor="middle">回复 / 追问候选</text>
<text x="340.0" y="2326" class="node-detail" text-anchor="middle">尚未提交客户消息</text>
<text x="340.0" y="2357" class="node-detail" text-anchor="middle">进入最终输入认领检查</text>
<rect x="675" y="2250" width="450" height="161" rx="18" fill="#fff6e5" stroke="#e6c27d" stroke-width="2"/>
<text x="900.0" y="2290" class="node-title" text-anchor="middle">转人工意图已确认</text>
<text x="900.0" y="2326" class="node-detail" text-anchor="middle">自愿 handoff；</text>
<text x="900.0" y="2357" class="node-detail" text-anchor="middle">或无依据纠正一次后仍无依据 / 预算耗尽</text>
<text x="900.0" y="2388" class="node-detail" text-anchor="middle">确认后不被后来输入覆盖</text>
<rect x="1275" y="2250" width="380" height="130" rx="18" fill="#fff1ef" stroke="#e1a9a4" stroke-width="2"/>
<text x="1465.0" y="2290" class="node-title" text-anchor="middle">运行最终失败</text>
<text x="1465.0" y="2326" class="node-detail" text-anchor="middle">模型错误 / 超时 / 预算耗尽</text>
<text x="1465.0" y="2357" class="node-detail" text-anchor="middle">保留失败记录 / agent_error</text>
<path d="M740 2162 L740 2205 L340 2205 L340 2250" class="edge"/>
<path d="M900 2162 L900 2250" class="amber-edge"/>
<path d="M1060 2162 L1060 2205 L1465 2205 L1465 2250" class="amber-edge"/>
<rect x="145" y="2425" width="390" height="120" rx="18" fill="#f5f8fc" stroke="#b7c8da" stroke-width="2"/>
<text x="340.0" y="2465" class="node-title" text-anchor="middle">最终输入认领检查</text>
<text x="340.0" y="2501" class="node-detail" text-anchor="middle">有新增输入：继续本 Run</text>
<text x="340.0" y="2532" class="node-detail" text-anchor="middle">更新本轮依据检查边界</text>
<path d="M340 2380 L340 2425" class="edge"/>
<path d="M145 2484 L108 2484 L108 2108 L705 2108" class="edge"/>
<rect x="277.5" y="2085" width="215" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="385" y="2115" class="legend" text-anchor="middle">新增输入 → 继续</text>
<rect x="145" y="2600" width="390" height="120" rx="18" fill="#f5f8fc" stroke="#b7c8da" stroke-width="2"/>
<text x="340.0" y="2640" class="node-title" text-anchor="middle">资格复核 + 事务提交</text>
<text x="340.0" y="2676" class="node-detail" text-anchor="middle">无新增输入</text>
<text x="340.0" y="2707" class="node-detail" text-anchor="middle">写消息、推进 processed_seq</text>
<path d="M340 2545 L340 2600" class="edge"/>
<rect x="380.0" y="2551" width="50" height="43" rx="12" fill="#ffffff" stroke="#ccd7e4" stroke-width="2"/>
<text x="405" y="2581" class="legend" text-anchor="middle">无</text>
<rect x="145" y="2770" width="390" height="130" rx="18" fill="#e9f7f1" stroke="#8bcebc" stroke-width="2"/>
<text x="340.0" y="2810" class="node-title" text-anchor="middle">succeeded</text>
<text x="340.0" y="2846" class="node-detail" text-anchor="middle">outcome = reply / ask_customer</text>
<text x="340.0" y="2877" class="node-detail" text-anchor="middle">保持 A，等待客户消息</text>
<path d="M340 2720 L340 2770" class="green-edge"/>
<rect x="735" y="2480" width="780" height="165" rx="18" fill="#fff6e5" stroke="#e6c27d" stroke-width="2"/>
<text x="1125.0" y="2520" class="node-title" text-anchor="middle">转人工资格复核 + 同一事务提交</text>
<text x="1125.0" y="2556" class="node-detail" text-anchor="middle">对客消息 + 内部原因 + 负责人 / 队列变化 + Run 终态</text>
<text x="1125.0" y="2587" class="node-detail" text-anchor="middle">旧 Lane 结算到锁内 desired_seq；后续输入由 Q / H 处理</text>
<text x="1125.0" y="2618" class="node-detail" text-anchor="middle">本路径不套用“模型可用”等接客资格门禁</text>
<path d="M900 2411 L900 2480" class="amber-edge"/>
<path d="M1465 2380 L1465 2440 L1350 2440 L1350 2480" class="amber-edge"/>
<rect x="735" y="2670" width="780" height="165" rx="18" fill="#e9f7f1" stroke="#8bcebc" stroke-width="2"/>
<text x="1125.0" y="2710" class="node-title" text-anchor="middle">业务 outcome = handoff</text>
<text x="1125.0" y="2746" class="node-detail" text-anchor="middle">succeeded：model_requested / insufficient_evidence / budget_exhausted</text>
<text x="1125.0" y="2777" class="node-detail" text-anchor="middle">failed：runtime_failed / timeout</text>
<text x="1125.0" y="2808" class="node-detail" text-anchor="middle">资格失效由管理操作交接（见脚注）；回到主面板 Q / H</text>
<path d="M1125 2645 L1125 2670" class="amber-edge"/>
<rect x="1210" y="1855" width="455" height="229" rx="18" fill="#fff1ef" stroke="#e1a9a4" stroke-width="2"/>
<text x="1437.5" y="1895" class="node-title" text-anchor="middle">cancelled</text>
<text x="1437.5" y="1931" class="node-detail" text-anchor="middle">人工接管 / 周期失效 / 主动停止</text>
<text x="1437.5" y="1962" class="node-detail" text-anchor="middle">取消运行并抑制旧结果</text>
<text x="1437.5" y="1993" class="node-detail" text-anchor="middle">主动停止仅结束本次 Run；</text>
<text x="1437.5" y="2024" class="node-detail" text-anchor="middle">负责人保持，后续客户消息可触发。</text>
<path d="M1095 2108 L1700 2108 L1700 1970 L1665 1970" class="edge" stroke-dasharray="8 7"/>
<text x="1327" y="2146" class="small" text-anchor="start">queued / running 均适用</text>
<rect x="100" y="2950" width="1600" height="222" rx="14" fill="#f7f9fc" stroke="#e3e9f1" stroke-width="2"/>
<text x="125" y="2990" class="legend" text-anchor="start">共同守卫：当前周期、开放状态、原负责人、Run 状态与 Task 租约；操作权失效时抑制旧结果。</text>
<text x="125" y="3025" class="legend" text-anchor="start">人工接管、周期关闭或主动停止先提交 → cancelled；租约丢失的旧执行器不能再提交。</text>
<text x="125" y="3060" class="legend" text-anchor="start">AI 停用或改为非客服角色 → 管理操作交接其开放周期；在途 Run cancelled / agent_unavailable，无 Run 亦交接。</text>
<text x="125" y="3095" class="legend" text-anchor="start">转人工将旧 Lane 的 processed_seq 结算到锁内 desired_seq；Run 保留实际 input_end_seq。</text>
<text x="125" y="3130" class="legend" text-anchor="start">依据约束作用于客户可见正文；追问与转人工可无证据；并入新输入后按新边界重新检查。</text>
<text x="80" y="3265" class="subtitle" text-anchor="start">阅读方式：上图看“谁负责与周期是否开放”，下图看“这一轮 AI 如何终结”。原始 Mermaid 文件与此图语义一致。</text>
</svg>