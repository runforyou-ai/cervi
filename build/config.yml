version: '3'

# 修改应用元数据后运行 common:update:build-assets 重新生成平台资源。
info:
  companyName: "runforyou"
  productName: "Cervi"
  productIdentifier: "app.runforyou.cervi"
  description: "Cervi is an open-source AI customer support teammate platform."
  copyright: "© 2026 武汉润予科技有限公司"
  comments: "https://cervi.runforyou.app"
  version: "0.0.1"

dev_mode:
  root_path: .
  log_level: info
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend FRONTEND_TARGET=desktop
      type: background
    - cmd: wails3 task run
      type: primary
