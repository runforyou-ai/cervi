name: "cervi"
arch: ${GOARCH}
platform: "linux"
version: "0.0.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Cervi is an open-source AI customer support teammate platform."
vendor: "runforyou"
homepage: "https://cervi.runforyou.app"
license: "MIT"
release: "1"

contents:
  - src: "./bin/cervi"
    dst: "/usr/local/bin/cervi"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/cervi.png"
  - src: "./build/linux/cervi.desktop"
    dst: "/usr/share/applications/cervi.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
